name: Windows product checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:win
      - name: Verify the portable executable
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -LiteralPath 'dist' -Filter 'Nanako-*-x64-portable.exe' -File)
          if ($artifacts.Count -ne 1) {
            throw 'The packaged Windows x64 portable executable was not produced.'
          }
          & $artifacts[0].FullName --media-compatibility-test
          if ($LASTEXITCODE -ne 0) { throw 'The packaged media compatibility harness failed.' }
          $report = Join-Path (Get-Location).Path 'dist\NanakoData\media-compatibility-report.json'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            throw 'The packaged media compatibility report was not produced.'
          }

name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag. Use vMAJOR.MINOR.PATCH or a SemVer pre-release suffix."
          }
          $version = $tag.Substring(1)
          $package = Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json
          $lock = Get-Content -LiteralPath 'package-lock.json' -Raw | ConvertFrom-Json
          $rootLockVersion = $lock.packages.PSObject.Properties[''].Value.version
          if ($package.version -ne $version -or $lock.version -ne $version -or $rootLockVersion -ne $version) {
            throw "Tag $tag must match package.json and package-lock.json versions (expected $version)."
          }

      - run: npm ci
      - run: npm test
      - run: npm run test:desktop-smoke

      - run: npm run package:win
      - name: Verify the portable executable
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $portableName = "Nanako-$version-x64-portable.exe"
          $portableMatches = @(Get-ChildItem -LiteralPath 'dist' -Filter $portableName -File)
          if ($portableMatches.Count -ne 1) {
            throw "Expected exactly one portable executable named $portableName."
          }
          $portable = $portableMatches[0]

          $mediaTest = Start-Process -FilePath $portable.FullName -ArgumentList '--media-compatibility-test' -Wait -PassThru -WindowStyle Hidden
          if ($mediaTest.ExitCode -ne 0) { throw 'The packaged media compatibility harness failed.' }
          $report = Join-Path (Get-Location).Path 'dist\NanakoData\media-compatibility-report.json'
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            throw 'The packaged media compatibility report was not produced.'
          }

          $trayTest = Start-Process -FilePath $portable.FullName -ArgumentList '--tray-smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($trayTest.ExitCode -ne 0) { throw 'The packaged system tray smoke test failed.' }
          $trayReport = Join-Path (Get-Location).Path 'dist\NanakoData\tray-smoke-report.json'
          if (-not (Test-Path -LiteralPath $trayReport -PathType Leaf)) {
            throw 'The packaged system tray smoke report was not produced.'
          }
          $trayResult = Get-Content -LiteralPath $trayReport -Raw | ConvertFrom-Json
          if (-not $trayResult.trayCreated -or -not $trayResult.closeHidesToTray -or -not $trayResult.windowRestored) {
            throw 'The packaged system tray smoke report indicates a failed check.'
          }

          $dataTest = Start-Process -FilePath $portable.FullName -ArgumentList '--data-path-smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($dataTest.ExitCode -ne 0) { throw 'The portable data-path smoke test failed.' }
          $dataReport = Join-Path (Get-Location).Path 'dist\NanakoData\data-path-smoke-report.json'
          $dataResult = Get-Content -LiteralPath $dataReport -Raw | ConvertFrom-Json
          $expectedDataRoot = Join-Path (Get-Location).Path 'dist\NanakoData'
          if ($dataResult.mode -ne 'portable' -or $dataResult.appDataDirectory -ne $expectedDataRoot) {
            throw 'The portable data path did not remain next to the executable.'
          }

      - run: npm run package:win:installer
      - name: Install and verify the per-user NSIS package
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $installerName = "Nanako-$version-x64-setup.exe"
          $installerMatches = @(Get-ChildItem -LiteralPath 'dist' -Filter $installerName -File)
          if ($installerMatches.Count -ne 1) {
            throw "Expected exactly one NSIS installer named $installerName."
          }
          $installer = $installerMatches[0]
          $installRoot = Join-Path $env:RUNNER_TEMP 'nanako-release-installer'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw 'The per-user NSIS install did not complete.' }

          $installedExecutable = Join-Path $installRoot 'Project Nanako.exe'
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw 'The installed application executable was not found.'
          }

          $userDataRoot = Join-Path $env:RUNNER_TEMP 'nanako-installed-userdata'
          $userDataArgument = "--user-data-dir=$userDataRoot"
          $dataTest = Start-Process -FilePath $installedExecutable -ArgumentList @($userDataArgument, '--data-path-smoke-test') -Wait -PassThru -WindowStyle Hidden
          if ($dataTest.ExitCode -ne 0) { throw 'The installed data-path smoke test failed.' }
          $dataReport = Join-Path $userDataRoot 'NanakoData\data-path-smoke-report.json'
          $dataResult = Get-Content -LiteralPath $dataReport -Raw | ConvertFrom-Json
          $expectedDataRoot = Join-Path $userDataRoot 'NanakoData'
          if ($dataResult.mode -ne 'installed' -or $dataResult.appDataDirectory -ne $expectedDataRoot) {
            throw 'The installed application data did not use its per-user userData directory.'
          }

          $trayTest = Start-Process -FilePath $installedExecutable -ArgumentList @($userDataArgument, '--tray-smoke-test') -Wait -PassThru -WindowStyle Hidden
          if ($trayTest.ExitCode -ne 0) { throw 'The installed system tray smoke test failed.' }
          $trayReport = Get-Content -LiteralPath (Join-Path $userDataRoot 'NanakoData\tray-smoke-report.json') -Raw | ConvertFrom-Json
          if (-not $trayReport.trayCreated -or -not $trayReport.closeHidesToTray -or -not $trayReport.windowRestored) {
            throw 'The installed system tray smoke report indicates a failed check.'
          }

      - name: Create checksums
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $names = @("Nanako-$version-x64-portable.exe", "Nanako-$version-x64-setup.exe")
          $lines = foreach ($name in $names) {
            $file = Get-Item -LiteralPath (Join-Path 'dist' $name)
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $portable = (Get-Item -LiteralPath "dist/Nanako-$version-x64-portable.exe").FullName
          $installer = (Get-Item -LiteralPath "dist/Nanako-$version-x64-setup.exe").FullName
          $checksums = (Get-Item -LiteralPath 'dist/SHA256SUMS.txt').FullName
          $ghArgs = @(
            'release', 'create', $tag, $portable, $installer, $checksums,
            '--title', $tag, '--generate-notes', '--verify-tag'
          )
          if ($version.Contains('-')) {
            $ghArgs += '--prerelease'
          } else {
            $ghArgs += '--latest'
          }
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed for $tag." }

